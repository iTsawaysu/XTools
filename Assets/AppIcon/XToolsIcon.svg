<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>XTools</title>
  <desc>A mint terminal monogram on a softly sculpted graphite square.</desc>
  <defs>
    <linearGradient id="shell" x1="240" y1="80" x2="740" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555E59"/>
      <stop offset="0.42" stop-color="#2B322F"/>
      <stop offset="1" stop-color="#111713"/>
    </linearGradient>
    <linearGradient id="face" x1="320" y1="96" x2="670" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343D38"/>
      <stop offset="0.5" stop-color="#222B26"/>
      <stop offset="1" stop-color="#171F1B"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0" r="0.95">
      <stop stop-color="#C0D7C5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#C0D7C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="384" y1="304" x2="552" y2="704" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4F7CF"/>
      <stop offset="0.5" stop-color="#9CE8B1"/>
      <stop offset="1" stop-color="#76D39B"/>
    </linearGradient>
    <linearGradient id="ivory" x1="640" y1="636" x2="640" y2="704" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F2E9"/>
      <stop offset="1" stop-color="#D6DDD2"/>
    </linearGradient>
    <linearGradient id="rim" x1="340" y1="80" x2="700" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7F3E8" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#E7F3E8" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#E7F3E8" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0A120D" flood-opacity="0.26"/>
    </filter>
    <filter id="relief" x="-15%" y="-15%" width="135%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#061009" flood-opacity="0.24"/>
    </filter>
    <path id="tile" d="M304 80H720C872 80 944 152 944 304V720C944 872 872 944 720 944H304C152 944 80 872 80 720V304C80 152 152 80 304 80Z"/>
    <path id="mark" d="M286 304H610Q622 304 622 316V380Q622 392 610 392H506V690Q506 704 492 704H420Q406 704 406 690V392H286Q274 392 274 380V316Q274 304 286 304Z"/>
  </defs>
  <use href="#tile" fill="url(#shell)" filter="url(#shadow)"/>
  <path d="M305 88H719C866 88 936 158 936 305V715C936 862 866 932 719 932H305C158 932 88 862 88 715V305C88 158 158 88 305 88Z" fill="url(#face)"/>
  <use href="#tile" fill="url(#light)"/>
  <use href="#tile" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <g filter="url(#relief)">
    <use href="#mark" transform="translate(0 3)" fill="#549B70"/>
    <use href="#mark" fill="url(#mint)"/>
    <path d="M289 306H607" fill="none" stroke="#E4FFE9" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <rect x="560" y="639" width="182" height="68" rx="12" fill="#A2AD9F"/>
    <rect x="560" y="636" width="182" height="68" rx="12" fill="url(#ivory)"/>
  </g>
</svg>
