name: CI

on:
  push:
    branches: [master, logic]
  pull_request:

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.*.app
      - name: Run test suite
        # 两个真实窗口的命令面板测试在无头 CI 环境存在时序抖动（本地基线
        # 亦可复现，见 CommandPaletteMotionTests / CommandPalettePresentationTests），
        # 待其稳定前先跳过，避免 CI 长期红。
        run: >
          swift test --no-parallel
          --skip realRootWindowKeepsFirstAndWarmRapidReversalsContinuous
          --skip reopeningRetainsTheSameNativeRowViewsAfterTheFirstPresentation
